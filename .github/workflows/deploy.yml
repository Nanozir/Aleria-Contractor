name: Deploy to GitHub Pages

# Works with either Pages setting:
# - "GitHub Actions": the deploy job below publishes the site.
# - "Deploy from a branch" (main, root): the build job commits the playable
#   index.html + assets/ back to main, which Pages then serves directly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Commit the built site to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets .nojekyll
          if git diff --cached --quiet; then echo "Built site already up to date"; else git commit -m "Update built site [skip ci]" && git push; fi
      - name: Stage site
        run: mkdir _site && cp -r index.html assets public .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true # fails harmlessly when Pages is set to "Deploy from a branch"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
